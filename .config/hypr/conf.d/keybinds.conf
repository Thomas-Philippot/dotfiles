bind = $mainMod SHIFT, F, fullscreenstate, -1 2

bind = CTRL ALT, T, exec, $terminal
bind = $mainMod SHIFT, L, exec, hyprlock
bind = ALT, TAB, exec, rofi -show window -theme ~/.config/rofi/window.rasi
bind = , XF86Calculator, exec, gnome-calculator
bind = $mainMod, space, exec, rofi -show drun -theme ~/.config/rofi/launcher.rasi
bind = $mainMod, T, exec, $HOME/.config/hypr/scripts/theme-switcher.sh
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Screenshots
bind = CTRL SHIFT, print, exec, $HOME/.config/hypr/scripts/screenshots/captureAll.sh
bind = CTRL, print, exec, $HOME/.config/hypr/scripts/screenshots/captureScreen.sh
bind = , print, exec, $HOME/.config/hypr/scripts/screenshots/captureArea.sh
